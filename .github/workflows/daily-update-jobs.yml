# 每日自动更新招聘数据
# 流程: 跑三个采集/合并脚本 -> 把新数据提交到仓库
#       仓库更新后 Vercel 会自动重新构建网站
name: daily-update-jobs

on:
  schedule:
    - cron: "0 22 * * *"        # UTC 22:00 = 北京时间每天早上 6:00
  workflow_dispatch:             # 也支持在 GitHub 页面手动触发

permissions:
  contents: write                # 允许机器人提交数据

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 采集并合并数据
        run: |
          python scraper/ats_foreign.py
          python scraper/iguopin_soe.py
          python scraper/merge_jobs.py

      - name: 提交新数据
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ web/data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "更新招聘数据 $(date -u +%F)"
            git push
          fi
